name: Build Slovopotok APK

on:
  push:
    branches:
      - codex/slovopotok-android
    paths:
      - "wordflow-android/**"
      - ".github/workflows/build-slovopotok.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordflow-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Inspect Mueller dictionary source
        run: |
          set -eu
          curl -L --fail --retry 3             "https://downloads.sourceforge.net/mueller-dict/mueller-dict-3.1.1.tar.gz"             -o /tmp/mueller-dict.tar.gz
          echo "6aebd3fdbe8f921e0011630d35137caf523fd40a  /tmp/mueller-dict.tar.gz" | sha1sum -c -
          tar -tzf /tmp/mueller-dict.tar.gz | sed -n '1,100p'
          mkdir -p /tmp/mueller-inspect
          tar -xzf /tmp/mueller-dict.tar.gz -C /tmp/mueller-inspect
          python3 - <<'PY'
          import gzip
          import pathlib
          import re

          root = pathlib.Path("/tmp/mueller-inspect")
          for path in sorted(root.rglob("*.dict.dz")):
              print(f"DICTIONARY {path.name} {path.stat().st_size}")
              with gzip.open(path, "rt", encoding="utf-8", errors="replace") as stream:
                  data = stream.read()
              for headword in ("go", "get", "light"):
                  match = re.search(
                      rf"(?m)^{re.escape(headword)}\r?\n((?:[ \t].*(?:\r?\n|$)){{1,12}})",
                      data,
                  )
                  if match:
                      print(f"SAMPLE {headword}:")
                      print(match.group(0)[:2000])
          PY

      - name: Prepare offline vocabulary
        run: python3 scripts/prepare_words.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='io.github.redsghost.slovopotok'"
          test "$(unzip -p "$APK" assets/words.csv | wc -l)" -eq 8001

      - name: Package deliverables
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Slovopotok-0.1.0.apk
          sha256sum dist/Slovopotok-0.1.0.apk > dist/SHA256SUMS.txt
          zip -r dist/Slovopotok-0.1.0-source.zip .             -x ".gradle/*" "app/build/*" "build/*" "dist/*"

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: slovopotok-0.1.0
          path: |
            wordflow-android/dist/Slovopotok-0.1.0.apk
            wordflow-android/dist/Slovopotok-0.1.0-source.zip
            wordflow-android/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
