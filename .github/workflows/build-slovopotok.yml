name: Build Slovopotok APK

on:
  push:
    branches:
      - codex/slovopotok-android
    paths:
      - "wordflow-android/**"
      - ".github/workflows/build-slovopotok.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordflow-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare offline vocabularies
        run: python3 scripts/prepare_words.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and vocabulary quality
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | grep "package: name='io.github.redsghost.slovopotok'"
          python3 - "$APK" <<'PY'
          import csv
          import io
          import sys
          import zipfile

          expected = {
              "assets/words_en_ru.csv": 10000,
              "assets/words_ru_en.csv": 8000,
          }
          with zipfile.ZipFile(sys.argv[1]) as archive:
              loaded = {}
              for name, count in expected.items():
                  with archive.open(name) as raw:
                      rows = list(csv.DictReader(io.TextIOWrapper(raw, encoding="utf-8")))
                  assert len(rows) == count, (name, len(rows))
                  sources = [row["source"].casefold() for row in rows]
                  assert len(sources) == len(set(sources)), name
                  loaded[name] = rows

          en_ru = {
              row["source"].casefold(): row["target"]
              for row in loaded["assets/words_en_ru.csv"]
          }
          assert en_ru["go"].startswith("идти"), en_ru["go"]
          assert en_ru["go"] != "перейти", en_ru["go"]
          assert en_ru["make"].startswith("делать"), en_ru["make"]
          print("Packaged vocabulary checks passed; go ->", en_ru["go"])
          PY

      - name: Package deliverables
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Slovopotok-0.2.0.apk
          zip -r dist/Slovopotok-0.2.0-source.zip . \
            -x ".gradle/*" "app/build/*" "build/*" "dist/*"
          zip -j dist/Slovopotok-0.2.0-source.zip \
            build/sources/mueller-dict-3.1.1.tar.gz
          sha256sum \
            dist/Slovopotok-0.2.0.apk \
            dist/Slovopotok-0.2.0-source.zip \
            > dist/SHA256SUMS.txt

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: slovopotok-0.2.0
          path: |
            wordflow-android/dist/Slovopotok-0.2.0.apk
            wordflow-android/dist/Slovopotok-0.2.0-source.zip
            wordflow-android/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
