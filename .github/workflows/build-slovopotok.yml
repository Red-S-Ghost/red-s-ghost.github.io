name: Build Slovopotok APK

on:
  push:
    branches:
      - codex/slovopotok-android
    paths:
      - "wordflow-android/**"
      - ".github/workflows/build-slovopotok.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordflow-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Inspect Mueller dictionary source
        run: |
          set -eu
          curl -L --fail --retry 3             "https://downloads.sourceforge.net/mueller-dict/mueller-dict-3.1.1.tar.gz"             -o /tmp/mueller-dict.tar.gz
          echo "6aebd3fdbe8f921e0011630d35137caf523fd40a  /tmp/mueller-dict.tar.gz" | sha1sum -c -
          mkdir -p /tmp/mueller-inspect
          tar -xzf /tmp/mueller-dict.tar.gz -C /tmp/mueller-inspect
          python3 - <<'PY'
          import gzip
          import pathlib

          alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
          digits = {value: index for index, value in enumerate(alphabet)}

          def decode_number(value):
              result = 0
              for character in value:
                  result = result * 64 + digits[character]
              return result

          root = pathlib.Path("/tmp/mueller-inspect")
          data_path = next(root.rglob("mueller-base.dict.dz"))
          index_path = next(root.rglob("mueller-base.index"))
          with gzip.open(data_path, "rb") as stream:
              data = stream.read()

          wanted = {"go", "get", "light", "make", "run"}
          for raw_line in index_path.read_bytes().splitlines():
              parts = raw_line.decode("utf-8", errors="replace").split("\t")
              if len(parts) < 3 or parts[0].casefold() not in wanted:
                  continue
              offset, size = decode_number(parts[1]), decode_number(parts[2])
              payload = data[offset:offset + size]
              print("INDEX", parts[0], parts[1], parts[2], offset, size)
              for encoding in ("utf-8", "koi8-r", "cp1251"):
                  print(encoding, repr(payload.decode(encoding, errors="replace")[:3000]))
          PY

      - name: Prepare offline vocabulary
        run: python3 scripts/prepare_words.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='io.github.redsghost.slovopotok'"
          test "$(unzip -p "$APK" assets/words.csv | wc -l)" -eq 8001

      - name: Package deliverables
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Slovopotok-0.1.0.apk
          sha256sum dist/Slovopotok-0.1.0.apk > dist/SHA256SUMS.txt
          zip -r dist/Slovopotok-0.1.0-source.zip .             -x ".gradle/*" "app/build/*" "build/*" "dist/*"

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: slovopotok-0.1.0
          path: |
            wordflow-android/dist/Slovopotok-0.1.0.apk
            wordflow-android/dist/Slovopotok-0.1.0-source.zip
            wordflow-android/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
